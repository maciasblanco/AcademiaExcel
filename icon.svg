<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo moderno -->
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <!-- Sombra sutil -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#excelGrad)" filter="url(#shadow)" />

  <!-- Cuadrícula / Estilo de Hoja de Cálculo -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="4">
    <!-- Líneas verticales -->
    <line x1="144" y1="96" x2="144" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="368" y1="96" x2="368" y2="416" />
    <!-- Líneas horizontales -->
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
  </g>

  <!-- Celdas destacadas (Simulando análisis de datos o gráfico) -->
  <rect x="144" y="256" width="112" height="80" rx="8" fill="#10b981" opacity="0.4" />
  <rect x="256" y="176" width="112" height="160" rx="8" fill="#34d399" opacity="0.5" />

  <!-- Letra X estilizada (Símbolo principal de Excel) -->
  <path d="M160 140L235 256L160 372H210L258 298L306 372H356L281 256L356 140H306L258 214L210 140H160Z" 
        fill="#ffffff" 
        filter="url(#shadow)" />
        
  <!-- Pequeño detalle de gráfico de barras flotante / insignia de curso -->
  <circle cx="390" cy="140" r="36" fill="#38bdf8" filter="url(#shadow)" />
  <path d="M374 145L384 155L408 130" stroke="#090d16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
